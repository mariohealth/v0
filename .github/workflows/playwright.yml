name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: |
          npm run dev &
          PID=$!
          trap "kill $PID" EXIT
          npx wait-on http://localhost:3000 --timeout 60000
          npm run test:e2e
        env:
          # This should point to the deployed Cloud Run API
          NEXT_PUBLIC_API_BASE_URL: https://mario-health-api-ei5wbr4h5a-uc.a.run.app
          NEXT_PUBLIC_FIREBASE_API_KEY: "fake-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mario-health.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mario-health"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mario-health.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abcdef"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
