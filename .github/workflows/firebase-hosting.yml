name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy_hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build and Export
        # This script runs basic validation and then 'npm run build' (next build)
        # ensuring frontend/out is generated correctly.
        run: |
          cd frontend
          bash scripts/validate-build.sh

      - name: Deploy to Firebase
        # Installs firebase-tools and deploys using the Service Account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARIO_MRF_DATA }}
        run: |
          npm install -g firebase-tools
          
          # Write secret to a file for authentication
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > ./service-account.json
          
          # Export credentials path for Google Auth libraries used by firebase-tools
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account.json"
          
          # Deploy only hosting to the specific project
          firebase deploy --only hosting --project mario-mrf-data
