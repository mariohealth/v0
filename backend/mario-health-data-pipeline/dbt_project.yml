# dbt_project.yml
# Main configuration file for Mario Health data pipeline

name: 'mario_health'
version: '1.0.0'
config-version: 2

# Project profile (references profiles.yml)
profile: 'mario_health'

# Directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Output directories
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  mario_health:
    # Default materialization for all models
    +materialized: table
    
    # Staging models (raw data cleaning)
    staging:
      +materialized: table
      +tags: ["staging"]

# Seed configurations (CSV files loaded to BigQuery)
seeds:
  mario_health:
    +enabled: true
    hospital_tins:
      +column_types:
        tin: STRING
    tin_metadata:
      +column_types:
        tin: STRING
    hospital_npi:
      +column_types:
        npi_id: STRING
    insurance_carriers:
      +column_types:
        id: STRING
    insurance_plans:
      +column_types:
        id: STRING
        carrier_id: STRING
    drug_match_rules_costplus:
      +column_types:
        rxnorm_cui: STRING
        match_score: NUMERIC
        ingredient_score: NUMERIC
        strength_score: NUMERIC
        form_score: NUMERIC
        is_generic: BOOLEAN
        needs_review: BOOLEAN
    drug_match_rules_goodrx:
      +column_types:
        rxnorm_cui: STRING
    hospital_general_information:
      +column_types:
        Facility ID: STRING
        Facility Name: STRING
        Address: STRING
        City or Town: STRING
        State: STRING
        ZIP Code: STRING
        County or Parish: STRING
        Telephone Number: STRING
        Hospital Type: STRING
        Hospital Ownership: STRING
        Emergency Services: STRING
        Meets criteria for birthing friendly designation: STRING
        Hospital overall rating: STRING
        Hospital overall rating footnote: STRING
        MORT Group Measure Count: STRING
        Count of Facility MORT Measures: STRING
        Count of MORT Measures Better: STRING
        Count of MORT Measures No Different: STRING
        Count of MORT Measures Worse: STRING
        MORT Group Footnote: STRING
        Safety Group Measure Count: STRING
        Count of Facility Safety Measures: STRING
        Count of Safety Measures Better: STRING
        Count of Safety Measures No Different: STRING
        Count of Safety Measures Worse: STRING
        Safety Group Footnote: STRING
        READM Group Measure Count: STRING
        Count of Facility READM Measures: STRING
        Count of READM Measures Better: STRING
        Count of READM Measures No Different: STRING
        Count of READM Measures Worse: STRING
        READM Group Footnote: STRING
        Pt Exp Group Measure Count: STRING
        Count of Facility Pt Exp Measures: STRING
        Pt Exp Group Footnote: STRING
        TE Group Measure Count: STRING
        Count of Facility TE Measures: STRING
        TE Group Footnote: STRING

# Documentation
docs-paths: ["docs"]

# Hooks (run before/after dbt operations)
on-run-start:
  - "{{ log('Starting Mario Health data pipeline...', info=True) }}"

on-run-end:
  - "{{ log('Pipeline complete!', info=True) }}"

# Variables (accessible in models via {{ var('variable_name') }})
vars:
  # Date ranges
  start_date: '2024-01-01'

  # Business logic thresholds
  min_provider_count: 3
  max_price_threshold: 100000

  # Carriers
  supported_carriers: ['UHC', 'Aetna', 'Cigna', 'Blue Cross', 'Humana']

  # Sprint/phase tracking
  current_sprint: 1
  mvp_cpt_codes: 10
